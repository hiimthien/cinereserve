version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: cinereserve-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - cinereserve-network

  # PHP 8.3-FPM Backend (Laravel API)
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cinereserve-php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    networks:
      - cinereserve-network

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cinereserve-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    networks:
      - cinereserve-network

  # Queue Worker for Background Jobs
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cinereserve-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    networks:
      - cinereserve-network

  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: cinereserve-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinereserve
      MYSQL_USER: cinereserve_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cinereserve-network

  # Redis Cache, Locking & Queue
  redis:
    image: redis:7-alpine
    container_name: cinereserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cinereserve-network

networks:
  cinereserve-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
